server {
    listen 80;
    server_name _;

    # La API expone sus rutas bajo /api; nginx las proxifica sin reescritura.
    # (IPv6-only: la api corre en la pila del host — network_mode: host — así
    # que su nombre DNS no resuelve desde esta bridge; host.docker.internal
    # apunta al host vía extra_hosts en docker-compose.yml.)
    location /api/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
