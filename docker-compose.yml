name: faro-seguros-rag

# Variables comunes para api y worker (el mismo código, dos procesos)
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://faro:faro@db:5432/faro
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_GATEWAY_ID: ${CLOUDFLARE_GATEWAY_ID:-}
  REJECTION_THRESHOLD: ${REJECTION_THRESHOLD:-0.75}
  CHUNK_SIZE: ${CHUNK_SIZE:-800}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: faro
      POSTGRES_PASSWORD: faro
      POSTGRES_DB: faro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faro -d faro"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - intergraf_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - intergraf_net

  api:
    build: ./backend
    # Migraciones versionadas al arrancar (decisión D05 de DECISIONS.md)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - intergraf_net

  worker:
    build: ./backend
    command: celery -A app.adapters.tasks.celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.adapters.tasks.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - intergraf_net

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - intergraf_net

  otel-collector:
    image: otel/opentelemetry-collector:0.112.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - intergraf_net

  # Opcional: UI de trazas para la demo de la entrevista
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - intergraf_net
    profiles: ["ui"]

volumes:
  pgdata:

networks:
  intergraf_net:
    # Red compartida con nombre exacto (sin prefijo del proyecto).
    # Debe existir antes de levantar:  docker network create intergraf_net
    # (make up la crea si falta). Si prefieres que compose la administre,
    # comenta la linea `external: true`.
    name: intergraf_net
    external: true
