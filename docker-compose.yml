name: faro-seguros-rag

# Variables comunes para api y worker (el mismo código, dos procesos)
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://faro:faro@db:5432/faro
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_GATEWAY_ID: ${CLOUDFLARE_GATEWAY_ID:-}
  REJECTION_THRESHOLD: ${REJECTION_THRESHOLD:-0.45}
  CHUNK_SIZE: ${CHUNK_SIZE:-800}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: faro
      POSTGRES_PASSWORD: faro
      POSTGRES_DB: faro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faro -d faro"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - intergraf_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - intergraf_net

  api:
    build: ./backend
    # Migraciones versionadas al arrancar (decisión D05 de DECISIONS.md)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # IPv6-only (mismo fix que el worker; ahora toca a la api por la consulta
    # de la Fase 3): /api/query llama al LLM de Cloudflare desde ESTE proceso
    # y en la bridge IPv4-interna no hay ruta IPv6 -> la consulta moriría en
    # 503. network_mode: host hereda la pila del host. Consecuencias: uvicorn
    # bindea el 8000 del host (el 'ports:' sobra y se quita), db/redis se
    # alcanzan por los puertos ya mapeados, y el frontend proxifica vía
    # host.docker.internal (extra_hosts en su servicio) porque 'api' ya no
    # resuelve desde la bridge.
    network_mode: host
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://faro:faro@localhost:5432/faro
      REDIS_URL: redis://localhost:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s


  worker:
    build: ./backend
    command: celery -A app.adapters.tasks.celery_app worker --loglevel=INFO --concurrency=2
    # FIX IPv6-only: esta maquina solo sale a internet por IPv6. La red bridge
    # de Docker es IPv4-interna y el contenedor no tiene ruta IPv6 -> no puede
    # resolver (ni conectar a) api.cloudflare.com -> [Errno -3] al embedizar.
    # network_mode: host hace que el worker comparta la pila de red del host,
    # que SÍ llega a Cloudflare por IPv6 (mismo camino que el otro proyecto en
    # venv). db y redis exponen puertos al host (5432/6379), asi que desde el
    # netns del host se alcanzan por localhost. (Fase 3: la api pasó a host
    # por el mismo motivo — /api/query llama al LLM; ver su servicio.)
    network_mode: host
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://faro:faro@localhost:5432/faro
      REDIS_URL: redis://localhost:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.adapters.tasks.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    # La api corre en la pila del host (IPv6-only): su nombre DNS ('api') no
    # resuelve desde esta bridge. host-gateway apunta al host, donde uvicorn
    # escucha en el 8000; nginx lo usa en proxy_pass.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - intergraf_net

  otel-collector:
    image: otel/opentelemetry-collector:0.112.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - intergraf_net

  # Opcional: UI de trazas para la demo de la entrevista
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - intergraf_net
    profiles: ["ui"]

volumes:
  pgdata:

networks:
  intergraf_net:
    # Red compartida con nombre exacto (sin prefijo del proyecto).
    # Debe existir antes de levantar:  docker network create intergraf_net
    # (make up la crea si falta). Si prefieres que compose la administre,
    # comenta la linea `external: true`.
    name: intergraf_net
    external: true
